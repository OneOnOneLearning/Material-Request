<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <style>
      .green { fill: #2c8d3c; }
      .blue { fill: #021938; }
      .red { fill: #f01823; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#f8f9fa"/>

  <!-- Scattered Shapes with low opacity - carefully spaced to avoid overlap -->
  <g opacity="0.06">

    <!-- TOP ROW -->
    <polygon class="green" points="50,40 110,130 -10,130"/> <!-- Triangle - far left -->
    <ellipse class="blue" cx="280" cy="80" rx="55" ry="32"/> <!-- Oval -->
    <rect class="red" x="480" y="50" width="70" height="45" rx="4"/> <!-- Rectangle -->
    <polygon class="red" points="1450,60 1510,140 1390,140"/> <!-- Triangle -->
    <ellipse class="green" cx="1680" cy="90" rx="50" ry="30"/> <!-- Oval -->
    <rect class="blue" x="1850" y="40" width="60" height="40" rx="4"/> <!-- Rectangle - far right -->

    <!-- UPPER MIDDLE ROW -->
    <ellipse class="red" cx="100" cy="280" rx="45" ry="28"/> <!-- Oval - left -->
    <rect class="green" x="320" y="250" width="65" height="42" rx="4"/> <!-- Rectangle -->
    <polygon class="blue" points="1600,240 1660,320 1540,320"/> <!-- Triangle -->
    <rect class="red" x="1820" y="270" width="55" height="38" rx="4"/> <!-- Rectangle - right -->

    <!-- MIDDLE ROW -->
    <polygon class="blue" points="40,480 100,560 -20,560"/> <!-- Triangle - left edge -->
    <rect class="red" x="200" y="450" width="60" height="40" rx="4"/> <!-- Rectangle -->
    <ellipse class="green" cx="1750" cy="500" rx="48" ry="28"/> <!-- Oval -->
    <polygon class="green" points="1880,460 1930,530 1830,530"/> <!-- Triangle - right edge -->

    <!-- LOWER MIDDLE ROW -->
    <ellipse class="blue" cx="80" cy="700" rx="50" ry="30"/> <!-- Oval - left -->
    <polygon class="red" points="280,680 340,760 220,760"/> <!-- Triangle -->
    <rect class="blue" x="1650" y="690" width="58" height="38" rx="4"/> <!-- Rectangle -->
    <ellipse class="red" cx="1860" cy="720" rx="45" ry="26"/> <!-- Oval - right -->

    <!-- BOTTOM ROW -->
    <rect class="green" x="30" y="900" width="65" height="42" rx="4"/> <!-- Rectangle - left -->
    <polygon class="green" points="260,880 320,960 200,960"/> <!-- Triangle -->
    <ellipse class="blue" cx="500" cy="950" rx="52" ry="30"/> <!-- Oval -->
    <rect class="red" x="1400" y="920" width="60" height="40" rx="4"/> <!-- Rectangle -->
    <polygon class="blue" points="1650,900 1710,980 1590,980"/> <!-- Triangle -->
    <ellipse class="green" cx="1870" cy="940" rx="45" ry="28"/> <!-- Oval - right -->

  </g>
</svg>
