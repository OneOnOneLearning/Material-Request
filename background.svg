<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <style>
      .green { fill: #2c8d3c; }
      .blue { fill: #021938; }
      .red { fill: #f01823; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#f8f9fa"/>

  <!-- ALL shapes in the CENTER of the screen, behind the form -->
  <g opacity="0.08">

    <!-- Center cluster - these are all in the middle where the form sits -->
    <polygon class="green" points="0,0 140,0 70,120" transform="translate(750, 100) rotate(15)"/> <!-- Large triangle -->
    <ellipse class="blue" cx="1100" cy="180" rx="80" ry="48" transform="rotate(-12, 1100, 180)"/> <!-- Large oval -->
    <rect class="red" x="880" y="280" width="70" height="45" rx="4" transform="rotate(20, 915, 302)"/> <!-- Medium rectangle -->

    <polygon class="red" points="0,0 100,0 50,85" transform="translate(700, 350) rotate(-18)"/> <!-- Large triangle -->
    <ellipse class="green" cx="1150" cy="420" rx="65" ry="38" transform="rotate(25, 1150, 420)"/> <!-- Medium oval -->
    <rect class="blue" x="820" y="480" width="55" height="35" rx="3" transform="rotate(-15, 847, 497)"/> <!-- Small rectangle -->

    <ellipse class="red" cx="950" cy="580" rx="90" ry="52" transform="rotate(10, 950, 580)"/> <!-- Large oval -->
    <polygon class="blue" points="0,0 80,0 40,70" transform="translate(1080, 550) rotate(-22)"/> <!-- Medium triangle -->
    <rect class="green" x="750" y="650" width="60" height="38" rx="3" transform="rotate(30, 780, 669)"/> <!-- Small rectangle -->

    <polygon class="green" points="0,0 120,0 60,100" transform="translate(850, 720) rotate(8)"/> <!-- Large triangle -->
    <ellipse class="blue" cx="1100" cy="780" rx="70" ry="42" transform="rotate(-20, 1100, 780)"/> <!-- Medium oval -->
    <rect class="red" x="700" y="850" width="50" height="32" rx="3" transform="rotate(18, 725, 866)"/> <!-- Small rectangle -->

    <ellipse class="green" cx="980" cy="920" rx="85" ry="50" transform="rotate(-15, 980, 920)"/> <!-- Large oval -->
    <polygon class="red" points="0,0 90,0 45,78" transform="translate(1100, 880) rotate(25)"/> <!-- Medium triangle -->
    <rect class="blue" x="800" y="980" width="65" height="40" rx="3" transform="rotate(-10, 832, 1000)"/> <!-- Medium rectangle -->

    <!-- Extra scattered shapes in center -->
    <polygon class="blue" points="0,0 60,0 30,52" transform="translate(920, 200) rotate(-25)"/> <!-- Small triangle -->
    <ellipse class="red" cx="800" cy="520" rx="45" ry="28" transform="rotate(35, 800, 520)"/> <!-- Small oval -->
    <rect class="green" x="1000" y="700" width="40" height="26" rx="2" transform="rotate(-30, 1020, 713)"/> <!-- Tiny rectangle -->
    <polygon class="green" points="0,0 50,0 25,44" transform="translate(1050, 320) rotate(12)"/> <!-- Small triangle -->
    <ellipse class="blue" cx="870" cy="850" rx="38" ry="24" transform="rotate(22, 870, 850)"/> <!-- Small oval -->

  </g>
</svg>
