<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <style>
      .green { fill: #2c8d3c; }
      .blue { fill: #021938; }
      .red { fill: #f01823; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#f8f9fa"/>

  <!-- Shapes clustered around center, peeking from behind the form -->
  <g opacity="0.08">

    <!-- TOP LEFT of form -->
    <polygon class="green" points="0,0 120,0 60,100" transform="translate(350, 80) rotate(15)"/> <!-- Large triangle -->
    <ellipse class="red" cx="520" cy="180" rx="45" ry="28" transform="rotate(-10, 520, 180)"/> <!-- Medium oval -->
    <rect class="blue" x="280" y="220" width="35" height="22" rx="3" transform="rotate(25, 297, 231)"/> <!-- Small rectangle -->

    <!-- TOP RIGHT of form -->
    <ellipse class="blue" cx="1400" cy="120" rx="70" ry="42" transform="rotate(12, 1400, 120)"/> <!-- Large oval -->
    <polygon class="red" points="0,0 80,0 40,70" transform="translate(1500, 180) rotate(-20)"/> <!-- Medium triangle -->
    <rect class="green" x="1320" y="250" width="30" height="20" rx="3" transform="rotate(-15, 1335, 260)"/> <!-- Small rectangle -->

    <!-- LEFT SIDE of form -->
    <polygon class="blue" points="0,0 100,0 50,85" transform="translate(300, 350) rotate(-12)"/> <!-- Large triangle -->
    <ellipse class="green" cx="420" cy="520" rx="55" ry="32" transform="rotate(18, 420, 520)"/> <!-- Medium oval -->
    <rect class="red" x="320" y="680" width="40" height="25" rx="3" transform="rotate(-8, 340, 692)"/> <!-- Small rectangle -->
    <polygon class="red" points="0,0 50,0 25,42" transform="translate(380, 820) rotate(22)"/> <!-- Small triangle -->

    <!-- RIGHT SIDE of form -->
    <ellipse class="red" cx="1520" cy="380" rx="60" ry="36" transform="rotate(-15, 1520, 380)"/> <!-- Large oval -->
    <polygon class="green" points="0,0 90,0 45,78" transform="translate(1480, 520) rotate(10)"/> <!-- Medium triangle -->
    <rect class="blue" x="1420" y="700" width="45" height="28" rx="3" transform="rotate(20, 1442, 714)"/> <!-- Small rectangle -->
    <ellipse class="blue" cx="1550" cy="850" rx="38" ry="24" transform="rotate(-22, 1550, 850)"/> <!-- Small oval -->

    <!-- BOTTOM LEFT of form -->
    <rect class="green" x="380" y="900" width="70" height="44" rx="4" transform="rotate(-18, 415, 922)"/> <!-- Medium rectangle -->
    <polygon class="blue" points="0,0 65,0 32,55" transform="translate(520, 950) rotate(8)"/> <!-- Small triangle -->
    <ellipse class="red" cx="320" cy="980" rx="48" ry="30" transform="rotate(15, 320, 980)"/> <!-- Medium oval -->

    <!-- BOTTOM RIGHT of form -->
    <polygon class="red" points="0,0 110,0 55,95" transform="translate(1350, 880) rotate(-10)"/> <!-- Large triangle -->
    <ellipse class="green" cx="1520" cy="970" rx="52" ry="32" transform="rotate(25, 1520, 970)"/> <!-- Medium oval -->
    <rect class="blue" x="1280" y="1000" width="32" height="20" rx="3" transform="rotate(-12, 1296, 1010)"/> <!-- Small rectangle -->

    <!-- EXTRA ACCENT SHAPES - closer to form -->
    <ellipse class="green" cx="480" cy="300" rx="25" ry="16" transform="rotate(30, 480, 300)"/> <!-- Tiny oval -->
    <rect class="red" x="550" cy="750" width="28" height="18" rx="2" transform="rotate(-25, 564, 759)"/> <!-- Tiny rectangle -->
    <polygon class="blue" points="0,0 30,0 15,26" transform="translate(440, 600) rotate(35)"/> <!-- Tiny triangle -->

    <polygon class="green" points="0,0 28,0 14,24" transform="translate(1380, 300) rotate(-30)"/> <!-- Tiny triangle -->
    <rect class="blue" x="1460" y="620" width="25" height="16" rx="2" transform="rotate(18, 1472, 628)"/> <!-- Tiny rectangle -->
    <ellipse class="red" cx="1350" cy="780" rx="22" ry="14" transform="rotate(-20, 1350, 780)"/> <!-- Tiny oval -->

  </g>
</svg>
